name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests use mongomock and a fake LLM, so the heavy ML
      # packages from requirements.txt are not needed here.
      - name: Install test dependencies
        run: pip install pytest==9.1.1 mongomock==4.3.0 httpx==0.28.1 fastapi==0.141.1 uvicorn==0.53.0 pydantic==2.13.5 pymongo==4.18.1
      - name: Run tests
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
